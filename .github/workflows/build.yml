name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller map_editor.spec

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: WarbandMapEditor-Windows-x64
          path: dist/WarbandMapEditor.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller map_editor.spec

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: WarbandMapEditor-Linux-x64
          path: dist/WarbandMapEditor

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WarbandMapEditor-Windows-x64
          path: release-windows/

      - uses: actions/download-artifact@v4
        with:
          name: WarbandMapEditor-Linux-x64
          path: release-linux/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-windows/WarbandMapEditor.exe
            release-linux/WarbandMapEditor
